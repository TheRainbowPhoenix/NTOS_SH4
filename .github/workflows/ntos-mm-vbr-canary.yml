name: NTOS Mm PE permissions and isolated VBR canary
on:
  push:
    branches:
      - feat/mm-permissions-vbr-canary-20261119
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ntos-mm-vbr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mm-vbr:
    name: SH4A PR rights + host tests + unhinted emulator canary
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ghcr.io/classpaddev/hollyhock-3:v2.2.2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - uses: actions/checkout@v7
      - name: Install host test toolchain
        run: apt-get update -qq && apt-get install -y -qq gcc g++ python3
      - name: Test all Mm/Ob/Ex/FS structures on host and preserve baseline
        run: |
          set -eu
          for name in nt_launch_policy_test nt_mm_permissions_test fault_pager_test nt_p0p2_host_test nt_io_injection_test nt_executive_test nt_flash_guard_test fs_guard_test console_glyph_test console_host_test; do
            g++ -std=c++20 -Wall -Wextra -Werror -pedantic -O2 "tests/$name.cpp" -o "/tmp/$name"
            "/tmp/$name"
          done
          gcc -std=c11 -O2 -Wno-pointer-to-int-cast -Wno-int-to-pointer-cast tests/coredll_files_test.c -o /tmp/core-files
          /tmp/core-files
      - name: Build protection-enabled no-unhinted-canary CP400 candidate
        run: |
          make -j4 BUILDDIR=obj_mm_ro OUTDIR=dist_mm_ro DEPDIR=.deps_mm_ro DEFINES="-DNTOS_ENABLE_TLB_MISS_PAGER=1 -DNTOS_ENABLE_IRQ_OWNERSHIP=1 -DNTOS_STREAMED_IMAGE_LOADING=1 -DNTOS_ENFORCE_PE_PAGE_PERMISSIONS=1" hh3
          test -s dist_mm_ro/NTOS.hh3
      - name: Build fully gated emulator VBR one-miss canary
        run: |
          make -j4 BUILDDIR=obj_vbr_canary OUTDIR=dist_vbr_canary DEPDIR=.deps_vbr_canary DEFINES="-DNTOS_ENABLE_TLB_MISS_PAGER=1 -DNTOS_ENABLE_IRQ_OWNERSHIP=1 -DNTOS_STREAMED_IMAGE_LOADING=1 -DNTOS_ENFORCE_PE_PAGE_PERMISSIONS=1 -DNTOS_ENABLE_CONTROLLED_VBR_FAULT_PROBE=1" hh3
          test -s dist_vbr_canary/NTOS.hh3
      - name: Build matching safe probe EXEs and separately gated fault payload
        run: |
          make -j4 ntx
          make -j4 nt-exec-probes dist_ntprobe/PROCFAIL.EXE dist_ntprobe/MMROTEST.EXE dist_ntprobe/FAULTCAN.EXE
          python3 tools/check_large4m_pe.py dist_ntprobe/LARGE4M.EXE
          for n in OBTEST EVTEST POOLTEST PROCTEST PROCNEXT PROCFINAL MMTEST IOTEST MMROTEST FAULTCAN LARGE4M; do
            test -s "dist_ntprobe/$n.EXE"
          done
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -O2 tests/pe_stream_test.cpp -o /tmp/pe-stream
          /tmp/pe-stream dist/COREDLL.DLL dist/CHAINTEST.EXE dist_ntprobe/LARGE4M.EXE
      - name: Upload opt-in real PR permissions, NO unhinted fault EXE
        uses: actions/upload-artifact@v7
        with:
          name: NTOS-CP400-MM-PR-RO-RW-EXPERIMENTAL-NO-FAULTCAN
          path: |
            dist_mm_ro/NTOS.hh3
            dist_ntprobe/MMROTEST.EXE
            dist_ntprobe/MMTEST.EXE
            dist_ntprobe/OBTEST.EXE
            dist_ntprobe/PROCTEST.EXE
            dist_ntprobe/PROCNEXT.EXE
            dist_ntprobe/PROCFINAL.EXE
            dist_ntprobe/IOTEST.EXE
            dist/HELLO.EXE
            dist/PAGERTEST.EXE
            dist/PAGERSTRESS.DLL
          if-no-files-found: error
          retention-days: 30
      - name: Upload *separate* one-miss VBR canary, EMULATOR ONLY
        uses: actions/upload-artifact@v7
        with:
          name: NTOS-EMULATOR-ONLY-ONE-UNHINTED-VBR-FAULT-CANARY
          path: |
            dist_vbr_canary/NTOS.hh3
            dist_ntprobe/FAULTCAN.EXE
            dist_ntprobe/MMROTEST.EXE
            dist/HELLO.EXE
          if-no-files-found: error
          retention-days: 30
