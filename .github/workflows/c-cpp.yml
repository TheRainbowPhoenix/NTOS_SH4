name: C/C++ CI

on:
  push:
    branches: [ "main", "ugfx" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "ugfx" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:   
  build-artifact:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/classpaddev/hollyhock-3:v2.2.2
      credentials:
       username: ${{ github.actor }}
       password: ${{ secrets.github_token }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Install python3 (for tools/elf2ntx.py)
      run: apt-get update -qq && apt-get install -y -qq python3 g++
    - run: make -j
    - name: Validate the real built HELLO.NTX base relocations
      run: python3 tools/check_ntx.py dist/HELLO.NTX
    - name: Validate actual SH4BE PE32 relocations and COREDLL IAT
      run: python3 tests/test_ce_pe.py --live dist/HELLO_PE.EXE
    - uses: actions/upload-artifact@v7
      with:
        path: dist/**
