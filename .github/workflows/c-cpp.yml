name: Build · copy to calculator

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device:
    name: Device package
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/classpaddev/hollyhock-3:v2.2.2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - uses: actions/checkout@v7
      - name: Install PE packaging dependency
        run: apt-get update -qq && apt-get install -y -qq python3 python3-pefile
      - name: Build NTOS and installed applications
        run: make -j4
      - name: Prepare calculator-ready files only
        run: |
          python3 tools/check_unified_bundle.py dist
          python3 tools/package_device.py --from-dist dist --out install
          python3 tools/check_unified_bundle.py install
          test -s install/NTOS.hh3
          test -s install/Windows/demo.cpl
          test ! -e install/NTOS.elf
          test ! -e install/FAULTTEST.EXE
          test ! -e install/phone-device
          find install -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Download this artifact and copy its contents to the calculator
        uses: actions/upload-artifact@v7
        with:
          name: NTOS-CP400
          path: install/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
