name: Build · copy to calculator

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Edge demo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig 0.14.0
        run: |
          curl --fail --location --retry 3 \
            https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz \
            -o "$RUNNER_TEMP/zig.tar.xz"
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"
      - name: Build Windows executable and demo DLLs
        run: |
          zig version
          # Rebuild even the DLLs currently tracked in Git.
          make -B -C edge/app ZIG="$(command -v zig)"
          make -C edge/ntos_win ZIG="$(command -v zig)" package
          test -s edge/ntos_win/ntos-windows/ntos_windows.exe
          python3 -m zipfile -t edge/ntos_win/ntos-windows.zip
      - name: Download and extract this artifact, then run run-edge.bat
        uses: actions/upload-artifact@v7
        with:
          name: NTOS-Windows-Edge
          path: edge/ntos_win/ntos-windows/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

  device:
    name: Device package
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/classpaddev/hollyhock-3:v2.2.2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - uses: actions/checkout@v7
      - name: Install PE packaging dependency
        run: apt-get update -qq && apt-get install -y -qq python3 python3-pefile
      - name: Build NTOS and installed applications
        run: make -j4
      - name: Check phone PE images and imports
        run: python3 payload/phone/check_phone.py --out dist
      - name: Prepare calculator-ready files only
        run: |
          python3 tools/check_unified_bundle.py dist
          python3 tools/package_device.py --from-dist dist --out install
          python3 tools/check_unified_bundle.py install
          test -s install/NTOS.hh3
          test -s install/Windows/demo.cpl
          test ! -e install/NTOS.elf
          test ! -e install/FAULTTEST.EXE
          test ! -e install/phone-device
          find install -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Download this artifact and copy its contents to the calculator
        uses: actions/upload-artifact@v7
        with:
          name: NTOS-CP400
          path: install/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
