name: C/C++ CI

on:
  push:
    branches: [ "main", "ugfx" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "ugfx" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:   
  build-artifact:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/classpaddev/hollyhock-3:v2.2.2
      credentials:
       username: ${{ github.actor }}
       password: ${{ secrets.github_token }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Install python3 (for tools/elf2ntx.py)
      run: apt-get update -qq && apt-get install -y -qq python3
    - run: make -j
    - name: Validate PE import tables
      run: python3 tools/elf2ntx.py --selftest && python3 tools/test_multimodule.py
    - uses: actions/upload-artifact@v7
      with:
        path: dist/**
