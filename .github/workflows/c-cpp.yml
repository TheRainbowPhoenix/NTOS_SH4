name: C/C++ CI

on:
  push:
    branches: [ "main", "ugfx" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "ugfx" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:   
  build-artifact:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/classpaddev/hollyhock-3:v2.2.2
      credentials:
       username: ${{ github.actor }}
       password: ${{ secrets.github_token }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Install python3 (for tools/elf2ntx.py)
      run: apt-get update -qq && apt-get install -y -qq python3 python3-pefile gcc
    - name: Build standard NTOS and every PE payload
      run: |
        make -j
        test -s dist/NTOS.hh3
        test -s dist/FAULTTEST.EXE
        test -s dist/FAULTSTRESS.DLL
    - name: Build both opt-in SH7305 paging images for download
      run: |
        make pager-experiment
        make pager-verify
        test -s dist_pager/NTOS.hh3
        test -s dist_pager_verify/NTOS.hh3
        sh4a_nofpueb-elf-nm dist_pager/NTOS.elf | grep -q ntos_vbr_template_start
        sh4a_nofpueb-elf-nm dist_pager_verify/NTOS.elf | grep -q ntos_pager_exception_callback
        # These must be separately configured HH3 files, not copies of dist/NTOS.hh3.
        ! cmp -s dist/NTOS.hh3 dist_pager/NTOS.hh3
        ! cmp -s dist_pager/NTOS.hh3 dist_pager_verify/NTOS.hh3
    - name: Compile isolated SH Renesas ABI candidate DLL and import test
      run: |
        make ce-abi-probe
        test -s dist_ce_abi/COREDLL.DLL
        test -s dist_ce_abi/CHAIN.DLL
        test -s dist_ce_abi/ABITEST.EXE
        sh4a_nofpueb-elf-objdump -dr obj_ce_abi/payload/chain.o > /tmp/ntos-abi-export.s
        sh4a_nofpueb-elf-objdump -dr obj_ce_abi/payload/abi_test.o > /tmp/ntos-abi-import.s
        test -s /tmp/ntos-abi-export.s
        test -s /tmp/ntos-abi-import.s
        echo "PASS Renesas candidate boundary compiled (NOT Microsoft ABI certified)"
    - name: Verify all phone apps, launcher ABI and native Settings/input views
      run: |
        python3 payload/phone/check_phone.py
        python3 tools/check_ntapi_table.py
        gcc -std=c11 -Wall -Wextra -Werror -Ipayload tests/ntapi_caps_test.c -o /tmp/ntapi-caps-test
        /tmp/ntapi-caps-test
        gcc -std=c11 -O2 -Wno-pointer-to-int-cast -Wno-int-to-pointer-cast tests/coredll_files_test.c -o /tmp/coredll-files-test
        /tmp/coredll-files-test
        python3 payload/phone/preview_phone.py
        test -s dist/phone-device/Apps/settings/settings.exe
        test -s dist/phone-device/SETTINGSUI.DLL
        test "$(find dist/phone-device/Apps -name '*.exe' | wc -l)" -eq 24
    - name: Validate PE import tables
      run: python3 tools/elf2ntx.py --selftest && python3 tools/test_multimodule.py && python3 tools/preview_native_gdi.py
    - name: Test recursive PE dependency closure
      run: python3 tools/test_dependency_graph.py
    - name: Validate GNU BFD parity and all PE DLL imports
      run: sh tools/test_binutils_parity.sh
    - name: Test hardware UTLB fault replacement model and 12-DLL virtual memory
      run: |
        apt-get update -qq && apt-get install -y -qq --no-install-recommends g++
        g++ -std=c++20 -Wall -Wextra -Werror -pedantic -O2 \
            tests/fault_pager_test.cpp -o /tmp/ntos-fault-pager
        /tmp/ntos-fault-pager
    - name: Test IRQ ownership remains disabled in host mode
      run: |
        apt-get update -qq && apt-get install -y -qq --no-install-recommends g++
        g++ -std=c++20 -Wall -Wextra -Werror -pedantic -O2 \
            tests/irq_handoff_test.cpp -o /tmp/ntos-irq-handoff
        /tmp/ntos-irq-handoff
    - name: Test on-demand PE page materializer (fault handler disabled)
      run: |
        apt-get update -qq && apt-get install -y -qq --no-install-recommends g++
        g++ -std=c++20 -Wall -Wextra -Werror -pedantic -O2 \
            tests/pe_pager_test.cpp -o /tmp/ntos-pe-pager
        /tmp/ntos-pe-pager
    - name: Compare lazy-page materialization to real PE section images
      run: |
        g++ -std=c++20 -Wall -Wextra -Werror -pedantic -O2 \
            tests/pe_page_parity_test.cpp -o /tmp/ntos-pe-page-parity
        /tmp/ntos-pe-page-parity \
            dist/COREDLL.DLL dist/XAMLUI.DLL dist/CHAIN.DLL \
            dist/CHAINTEST.EXE dist/METROWIN.EXE
    - name: Audit native SH4BE PE image headers as WinCE binaries
      run: python3 tools/audit_wince_pe.py dist/COREDLL.DLL dist/XAMLUI.DLL dist/METROWIN.EXE
    - name: Validate WinCE SH relocation kinds and large image tables
      run: |
        apt-get update -qq && apt-get install -y -qq --no-install-recommends g++
        g++ -std=c++20 -Wall -Wextra -Werror -pedantic -O2 \
            tests/pe_fixup_types_test.cpp -o /tmp/ntos-pe-fixup-types
        /tmp/ntos-pe-fixup-types
    - name: Test overlapping-base DLL relocation with native PE images
      run: |
        apt-get update -qq && apt-get install -y -qq --no-install-recommends g++
        g++ -std=c++20 -Wall -Wextra -Werror -pedantic -O2 \
            tests/pe_rebase_test.cpp -o /tmp/ntos-pe-rebase-test
        python3 tools/make_collision_dll.py dist/XAMLUI.DLL \
            -o dist_collision/XAMLUI.DLL --base 0x01000000
        /tmp/ntos-pe-rebase-test \
            dist/COREDLL.DLL dist/XAMLUI.DLL dist/METROWIN.EXE \
            dist_collision/XAMLUI.DLL
    - name: Upload standard, exception-pager and UTLB-verify distributions
      uses: actions/upload-artifact@v7
      with:
        name: ntos-sh4-all-builds
        if-no-files-found: error
        path: |
          dist/**
          dist_pager/**
          dist_pager_verify/**
          dist_ce_abi/**
          dist_collision/**

  build-hh3-v221:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/classpaddev/hollyhock-3:v2.2.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Python for PE packaging
      run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3
    - name: Build with the exact user Podman toolchain
      run: |
        export PATH=/toolchain/bin:$PATH
        make -j4
        test -s dist/NTOS.hh3
        test -s dist/COREDLL.DLL
        test -s dist/XAMLUI.DLL
        test -s dist/METROWIN.EXE
        test -s dist/MEMTOOL.EXE
        make check-pe
        echo "PASS HH3 v2.2.1: NTOS and all DLL/EXE images built and verified"

  # Experimental P1 RAM-backed MMU fault vector. Compile-only: NEVER
  # execute VBR ownership changes in CI or default device artifacts.
  build-experimental-tlb-fault:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/classpaddev/hollyhock-3:v2.2.1
    steps:
    - uses: actions/checkout@v7
    - name: Install PE packaging support
      run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3
    - name: Compile isolated opt-in SH4A exception pager
      run: |
        export PATH=/toolchain/bin:$PATH
        make pager-experiment
        test -s dist_pager/NTOS.hh3
        make pager-verify
        test -s dist_pager_verify/NTOS.hh3
        sh4a_nofpueb-elf-nm dist_pager/NTOS.elf | grep -q ntos_vbr_template_start
        sh4a_nofpueb-elf-nm dist_pager/NTOS.elf | grep -q ntos_pager_exception_callback
        echo "PASS regular + P4-readback diagnostic pager binaries linked (NOT hardware tested)"
