# ONE-TIME branch cleanup requested by the repository owner on 2026-11-19.
# Every ref is hardcoded, lease-checked, linked to a merged PR and checked
# to be an ancestor of main before deletion. The active Mm/VBR PR14 is
# deliberately NOT listed. Remove this workflow after successful cleanup.
name: One-off cleanup merged NTOS experiment branches
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-merged-ntos-branches-once.yml
permissions:
  contents: write
jobs:
  prune:
    if: github.repository == 'TheRainbowPhoenix/NTOS_SH4' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only verified merged feature refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          while IFS='|' read -r pr branch expected; do
            [[ -n "$pr" ]] || continue
            actual="$(gh api "repos/${repo}/git/ref/heads/${branch}" --jq '.object.sha')"
            merged="$(gh api "repos/${repo}/pulls/${pr}" --jq '.merged')"
            ahead="$(gh api "repos/${repo}/compare/main...${actual}" --jq '.ahead_by')"
            echo "PR #${pr}: ${branch}, actual=${actual}, merged=${merged}, ahead=${ahead}"
            if [[ "$merged" != true || "$actual" != "$expected" || "$ahead" != 0 ]]; then
              echo "::error::Lease/merged/ancestry check failed; refusing branch deletion"
              exit 1
            fi
            gh api --method DELETE "repos/${repo}/git/refs/heads/${branch}" >/dev/null
            echo "Deleted verified merged ref ${branch}"
          done <<'BRANCHES'
          9|fix/stream-pe-file-staging-20261119|72f48daac349ff4fe0bc2611261808dd78b1dac8
          10|feat/nt-executive-ob-ex-4mb-probe|fb3011582d877618555abf5fefadd4ecab658b8c
          11|fix/console-full-14px-glyphs|3c08a766294d16556ae9e07ba6fca99206bd82fd
          12|exp/cp400-4mib-runtime-probes|f12088346235952798878bb2fd5e81c203841d67
          13|feat/ntos-p0-p2-probe-suite|133d3067c10ac5e7845cb5d120dbb901ea09d54c
          BRANCHES
