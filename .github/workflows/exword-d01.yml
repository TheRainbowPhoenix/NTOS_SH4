name: NTOSH EX-word native D01
on:
  push:
    branches: [feat/exword-d01-ntosh-20261121]
  pull_request:
    paths:
      - "exword/**"
      - "Makefile"
      - "payload/**"
      - "tools/elf2ntx.py"
      - "tools/package_exword_flat.py"
      - "tests/exword_packaging_test.py"
      - "tests/exword_names_test.c"
      - "tests/exword_vm_test.cpp"
      - "tests/exword_rom_mmu_test.cpp"
      - "tests/exword_native_vm_test.cpp"
      - "tests/exword_ob_ex_test.cpp"
      - "src/nt/**"
      - "src/pe.hpp"
      - "src/pe_stream.hpp"
      - "src/pe_rebase.hpp"
      - "payload/coredll.c"
      - "payload/wince/**"
      - "tools/check_exword_d01.py"
      - ".github/workflows/exword-d01.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ntosh-exword-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pe-payloads:
    name: Build shared NTOS SH4BE EXE/DLL payloads
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/classpaddev/hollyhock-3:v2.2.2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Python/PE dependencies (same as NTOS.hh3 CI)
        shell: bash
        run: apt-get update -qq && apt-get install -y -qq python3 python3-pefile
      - name: Build NTOS.hh3, EXEs, DLLs and phone applications
        shell: bash
        run: |
          set -euo pipefail
          make -j4
          make exword-probes
          for probe in VMTEST OBTEST EVTEST POOLTEST IOTEST PROCTEST PROCNEXT PROCFINAL MMTEST MMROTEST NATIVEVM MMREUSE MMSTRESS ROMDIAG DLGCHK GWESCHK PAGERTEST; do
            test -s "dist/${probe}.EXE"
          done
          test -s dist/PAGERSTRESS.DLL
          # An Exword pager DLL must never contain the CP400-only P0
          # 0x08100000 NtosApi literal that previously triggered a
          # fatal translation fault.
          python3 - <<'PY'
          from pathlib import Path
          pager = Path("dist/PAGERSTRESS.DLL").read_bytes()
          assert b"\x08\x10\x00\x00" not in pager, (
              "Exword P1 pager still embeds CP400 P0 API window"
          )
          print("PASS Exword 80-page pager DLL uses passed host table, no CP400 P0 API")
          PY
          test -s dist/HELLO.EXE
          test -s dist/HELLOCORE.EXE
          test -s dist/COREDLL.DLL
          test -s dist/XAMLUI.DLL
          test "$(find dist/Apps -mindepth 2 -maxdepth 2 -iname '*.exe' | wc -l)" -eq 24
      - uses: actions/upload-artifact@v4
        with:
          name: NTOSH-SH4BE-PE-build
          path: dist/
          if-no-files-found: error
  build:
    needs: pe-payloads
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/therainbowphoenix/gint-docker:main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NTOSH-SH4BE-PE-build
          path: ntos-pe-dist
      - name: Test portable NTOS Ke/Ps/Ob/Ex code used in D01
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -Os -Wall -Wextra -Werror tests/exword_port_test.cpp -o /tmp/ntosh-exword-port-test
          /tmp/ntosh-exword-port-test
          python3 tests/exword_packaging_test.py
          cc -std=c11 -Os -Wall -Wextra -Werror tests/exword_names_test.c -o /tmp/ntosh-exword-name-test
          /tmp/ntosh-exword-name-test
          c++ -std=c++17 -Os -Wall -Wextra -Werror tests/exword_vm_test.cpp -o /tmp/ntosh-exword-vm-test
          /tmp/ntosh-exword-vm-test
          c++ -std=c++17 -Os -Wall -Wextra -Werror tests/exword_rom_mmu_test.cpp -o /tmp/ntosh-rom-mmu-test
          /tmp/ntosh-rom-mmu-test
          c++ -std=c++17 -Os -Wall -Wextra -Werror tests/exword_native_vm_test.cpp -o /tmp/ntosh-native-vm-test
          /tmp/ntosh-native-vm-test
          c++ -std=c++17 -Os -Wall -Wextra -Werror tests/exword_ob_ex_test.cpp -o /tmp/ntosh-exword-ob-ex-test
          /tmp/ntosh-exword-ob-ex-test
          for test in pe_stream_test pe_fixup_types_test pe_forwarder_test; do
            c++ -std=c++20 -Os -Wall -Wextra -Werror "tests/${test}.cpp" -o "/tmp/${test}"
            "/tmp/${test}"
          done
      - name: Install EX-word fxSDK and D01 converter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch exword https://github.com/TheRainbowPhoenix/fxsdk-exword.git /tmp/fxsdk-src
          cmake -S /tmp/fxsdk-src -B /tmp/fxsdk-build \
            -DCMAKE_INSTALL_PREFIX=/tmp/fxsdk-exword \
            -DFXLINK_DISABLE_SDL2=ON -DFXLINK_DISABLE_UDISKS2=ON
          cmake --build /tmp/fxsdk-build --parallel 2
          cmake --install /tmp/fxsdk-build
          git clone --depth=1 https://github.com/brijohn/elf2d01.git /tmp/elf2d01
          cc -O2 /tmp/elf2d01/elf2d01.c -o /tmp/fxsdk-exword/bin/elf2d01
          echo /tmp/fxsdk-exword/bin >> "$GITHUB_PATH"
      - name: Install EX-word gint runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch exword https://github.com/TheRainbowPhoenix/gint-exword.git /tmp/gint-src
          cmake -S /tmp/gint-src -B /tmp/gint-build \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/fxsdk-exword/lib/cmake/fxsdk/EXWORD.cmake \
            -DCMAKE_INSTALL_PREFIX=/tmp/gint-exword \
            -DCMAKE_MODULE_PATH=/tmp/fxsdk-exword/lib/cmake/fxsdk
          cmake --build /tmp/gint-build --parallel 2
          cmake --install /tmp/gint-build
      - name: Cross-build direct native D01 and JP/CN install packages
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/TheRainbowPhoenix/exword-xd-a8500-TEST.git /tmp/exword-metadata
          cmake -S exword -B build-exword \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/fxsdk-exword/lib/cmake/fxsdk/EXWORD.cmake \
            -DCMAKE_PREFIX_PATH=/tmp/gint-exword \
            '-DCMAKE_MODULE_PATH=/tmp/gint-exword/lib/cmake/fxsdk;/tmp/fxsdk-exword/lib/cmake/fxsdk' \
            -DEXWORD_METADATA_SOURCE=/tmp/exword-metadata \
            -DEXWORD_PAYLOAD_DIR="$GITHUB_WORKSPACE/ntos-pe-dist"
          cmake --build build-exword --parallel 2
          python3 tools/check_exword_d01.py build-exword ntos-pe-dist
          sh-elf-readelf -h build-exword/ntos_sh
          sh-elf-nm build-exword/ntos_sh | grep -E '_exword_entry|_mmu_exword_prepare|_main'
          (cd build-exword && sha256sum ntos_sh.d01 NTOS.d01 > BUILD-SHA256.txt)
          git rev-parse HEAD > build-exword/BUILD-ID.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NTOSH-EXWORD-JA
          path: build-exword/packages/ja/NTOSH/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: NTOSH-EXWORD-CN
          path: build-exword/packages/cn/NTOSH/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: NTOSH-D01-debug
          path: |
            build-exword/ntos_sh.d01
            build-exword/NTOS.d01
            build-exword/ntos_sh
            build-exword/ntos_sh.map
            build-exword/BUILD-SHA256.txt
            build-exword/BUILD-ID.txt
          if-no-files-found: error
