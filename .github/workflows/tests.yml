name: Tests · no release artifacts
# Confirm Clang-normalized VEC2 decoder, native editor and Settings UI tests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ntos-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-ui:
    name: Native CMD and GDI host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bounded command grammar and tiled window layouts
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic tests/native_cmd_tiling_test.c -o /tmp/ntos-native-cmd-tiles
          /tmp/ntos-native-cmd-tiles
      - name: Shipping COREDLL RGB565 raster and clipping
        run: |
          gcc -std=c11 -O2 -Wno-pointer-to-int-cast -Wno-int-to-pointer-cast tests/native_gdi_raster_test.c -o /tmp/ntos-gdi-raster
          /tmp/ntos-gdi-raster
  validation:
    name: Validation
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/classpaddev/hollyhock-3:v2.2.2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 python3-pefile gcc g++ clang-format clang-tidy
      - name: Build native test fixtures
        run: make -j4
      - name: Bounded streamed PE header parser regression
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -O2 tests/pe_stream_test.cpp -o /tmp/pe-stream-test
          /tmp/pe-stream-test dist/COREDLL.DLL dist/XAMLUI.DLL dist/CHAIN.DLL dist/CHAINTEST.EXE dist/METROWIN.EXE
      - name: Compile stream-off and conservative stream-on rollback variants
        run: |
          make -j4 BUILDDIR=obj_stream_off OUTDIR=dist_stream_off DEPDIR=.deps_stream_off DEFINES="-DNTOS_ENABLE_TLB_MISS_PAGER=1 -DNTOS_ENABLE_IRQ_OWNERSHIP=1 -DNTOS_STREAMED_IMAGE_LOADING=0" hh3
          make -j4 BUILDDIR=obj_stream_eager OUTDIR=dist_stream_eager DEPDIR=.deps_stream_eager DEFINES="-DNTOS_STREAMED_IMAGE_LOADING=1" hh3
          test -s dist_stream_off/NTOS.hh3
          test -s dist_stream_eager/NTOS.hh3
      - name: NT Ob/Ex ownership and poison-gate host regressions
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -O2 tests/nt_executive_test.cpp -o /tmp/nt-executive-test
          /tmp/nt-executive-test
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -O2 tests/nt_thread_exceptions_test.cpp -o /tmp/nt-thread-exceptions-test
          /tmp/nt-thread-exceptions-test
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -O2 tests/fs_guard_test.cpp -o /tmp/nt-fs-guard-test
          /tmp/nt-fs-guard-test
      - name: Produce and validate opt-in 4 MiB real SH4BE PE
        run: |
          make nt-exec-probes
          test -s dist_ntprobe/OBTEST.EXE
          python3 tools/check_large4m_pe.py dist_ntprobe/LARGE4M.EXE
          /tmp/pe-stream-test dist_ntprobe/LARGE4M.EXE
      - name: Static checks and PE import/link validation
        run: |
          python3 tools/format_c_sources.py --check
          clang-tidy -quiet -checks='-*,clang-analyzer-*' payload/calc.c payload/phone/starthost.c -- -std=c11 -Ipayload -Ipayload/phone
          python3 -m py_compile tools/svf_icon_preflight.py payload/phone/generate_apps.py
          python3 -c 'import xml.etree.ElementTree as E; from pathlib import Path; [E.parse(p) for p in Path("payload/phone/svg_reference").glob("*.svg")]'
          python3 tools/check_unified_bundle.py dist
          python3 tools/check_ntapi_table.py dist/NTOS.elf
          python3 tools/elf2ntx.py --selftest
          python3 tools/test_multimodule.py
          python3 tools/test_dependency_graph.py
          python3 tools/audit_wince_pe.py dist/COREDLL.DLL dist/XAMLUI.DLL dist/METROWIN.EXE
          make check-pe
      - name: Native CMD and PEG-like tile geometry regressions
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic tests/native_cmd_tiling_test.c -o /tmp/ntos-native-cmd-tiles
          /tmp/ntos-native-cmd-tiles
          test -s dist/CMD.EXE
          test -s dist/GDILAB.EXE
          gcc -std=c11 -O2 -Wno-pointer-to-int-cast -Wno-int-to-pointer-cast \
            tests/native_gdi_raster_test.c -o /tmp/ntos-gdi-raster
          /tmp/ntos-gdi-raster
      - name: UI and host COREDLL regressions
        run: |
          python3 payload/phone/check_phone.py
          python3 payload/phone/preview_phone.py
          gcc -std=c11 -Wall -Wextra -Werror -DPHONE_HOST=1 -Ipayload/phone -Ipayload \
            payload/phone/settingsui.c tests/settings_ui_interaction_test.c -o /tmp/ntos-settings-ui
          /tmp/ntos-settings-ui
          gcc -std=c11 -Wall -Wextra -Werror -DPHONE_HOST=1 -Ipayload/phone -Ipayload \
            payload/phone/svf.c tests/svf_v2_test.c -o /tmp/ntos-svf-v2
          /tmp/ntos-svf-v2
          python3 tools/preview_native_gdi.py
          gcc -std=c11 -Wall -Wextra -Werror -Ipayload tests/ntapi_caps_test.c -o /tmp/ntos-caps
          /tmp/ntos-caps
          gcc -std=c11 -O2 -Wno-pointer-to-int-cast -Wno-int-to-pointer-cast tests/coredll_files_test.c -o /tmp/ntos-core-files
          /tmp/ntos-core-files
      - name: Exclusive filesystem ownership regression
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -O2 tests/fs_guard_test.cpp -o /tmp/fs-guard
          /tmp/fs-guard
          python3 tools/check_fs_guard_wiring.py
      - name: MMU, PE page materializer and relocation regressions
        run: |
          set -e
          for test in fault_pager irq_handoff pe_pager pe_stream pe_fixup_types; do
            g++ -std=c++20 -Wall -Wextra -Werror -pedantic -O2 "tests/${test}_test.cpp" -o "/tmp/${test}"
            "/tmp/${test}"
          done
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -O2 tests/pe_page_parity_test.cpp -o /tmp/pe-page-parity
          /tmp/pe-page-parity dist/COREDLL.DLL dist/XAMLUI.DLL dist/CHAIN.DLL dist/CHAINTEST.EXE dist/METROWIN.EXE
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -O2 tests/pe_rebase_test.cpp -o /tmp/pe-rebase
          python3 tools/make_collision_dll.py dist/XAMLUI.DLL -o dist_collision/XAMLUI.DLL --base 0x01000000
          /tmp/pe-rebase dist/COREDLL.DLL dist/XAMLUI.DLL dist/METROWIN.EXE dist_collision/XAMLUI.DLL
      # Deliberately no artifact upload: diagnostics are not calculator files.
