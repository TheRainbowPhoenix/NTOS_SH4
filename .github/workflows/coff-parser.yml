name: BE COFF header regression

on:
  push:
    branches: ["fix/coff-header-relocations"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ELF to NTX conversion self-test
        run: python3 tools/elf2ntx.py --selftest
      - name: Verify BE COFF headers, section placement and base relocations
        run: python3 tests/test_coff_parser.py
