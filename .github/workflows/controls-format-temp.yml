# Temporary scoped formatter; self-removed after writing the six new files.
name: NTOS temporary controls formatter
on:
  push:
    branches: [feat/user-controls-hwnd-20261123]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/classpaddev/hollyhock-3:v2.2.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update -qq
          apt-get install -y -qq clang-format
      - name: Format only new native control sources/tests
        run: |
          clang-format --style=file -i             payload/commctrl_native.c payload/ctrldemo.c             payload/wince/nt_common_controls.h             tests/commctrl_native_test.c tests/nt_common_controls_test.c             tests/coredll_common_controls_test.c
      - name: Commit only new-file formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payload/commctrl_native.c payload/ctrldemo.c payload/wince/nt_common_controls.h tests/commctrl_native_test.c tests/nt_common_controls_test.c tests/coredll_common_controls_test.c
          if ! git diff --cached --quiet; then
            git commit -m "style: format new native common control files"
            git push origin HEAD:feat/user-controls-hwnd-20261123
          fi
