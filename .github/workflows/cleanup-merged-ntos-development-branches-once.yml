name: One-time guarded cleanup of merged NTOS development branches
on:
  push:
    paths:
      - .github/workflows/cleanup-merged-ntos-development-branches-once.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Delete only exact SHA-verified branches already ancestors of main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while read -r branch sha; do
            [ -n "$branch" ] || continue
            existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
            if [ "$existing" != "$sha" ]; then
              echo "SAFETY STOP: ${branch} advanced or changed (${existing})"
              exit 1
            fi
            git cat-file -e "${sha}^{commit}"
            git merge-base --is-ancestor "$sha" HEAD || {
              echo "SAFETY STOP: ${branch} contains commits not merged to main"
              exit 1
            }
            echo "Deleting merged unmodified branch ${branch} at ${sha}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done <<'REFS'
          feat/mm-permissions-vbr-canary-20261119 274787d4a72e0e398d0ff0ed416472b5cc0634ae
          feat/nt-vm-prot-exception-dll-init-20261120 48966163d88e319cbce30c4fc81cd4a5e78eca31
          fix/mm-prot-tlb-and-picker-jump-20261120 b5dae852babb3673dab8cde2cc500350e506fe42
          fix/cp400-guest-prot-trap-user-probe-20261120 bf1f4bfaa3a796bacf86fd29bd07ddbfe42c297f
          fix/cp400-protect-write-user-trap-ntvm-20261120 0d1b6911d968dae4debd4bc43b6e0bc7ba816edf
          REFS
