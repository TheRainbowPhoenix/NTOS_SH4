# Temporary, narrowly scoped source normalization for PR #39.
# Remove this workflow after the formatter's single write-back.
name: Native UI temporary formatter
on:
  push:
    branches: [feat/native-cmd-tile-gdi-20261122]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/classpaddev/hollyhock-3:v2.2.2
    steps:
      - uses: actions/checkout@v4
      - name: Install same formatter used by validation
        run: |
          apt-get update -qq
          apt-get install -y -qq clang-format
      - name: Format only changed UI and regression sources
        run: |
          clang-format --style=file -i             payload/nt_cmd_model.h payload/nt_tiling.h             payload/cmd.c payload/gdilab.c             tests/native_cmd_tiling_test.c tests/native_gdi_raster_test.c
      - name: Commit scoped formatting changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payload/nt_cmd_model.h payload/nt_tiling.h payload/cmd.c payload/gdilab.c tests/native_cmd_tiling_test.c tests/native_gdi_raster_test.c
          if ! git diff --cached --quiet; then
            git commit -m "style: format new native CMD/GDI sources"
            git push origin HEAD:feat/native-cmd-tile-gdi-20261122
          fi
